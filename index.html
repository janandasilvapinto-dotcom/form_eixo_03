<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eixo 3 · Da Planilha ao Sistema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --ground:#F7F4EC; --surface:#FFFFFF; --surface-2:#FBF9F2;
  --ink:#1A2A21; --muted:#5C6B62;
  --brand:#163B2B; --brand-soft:#2A5A43;
  --gold:#E8A317; --gold-deep:#B07708;
  --line:rgba(22,59,43,.14); --line-strong:rgba(22,59,43,.28);
  --good:#2E7D53; --good-bg:rgba(46,125,83,.12);
  --bad:#BE3F29; --bad-bg:rgba(190,63,41,.10);
  --shadow:0 1px 2px rgba(22,59,43,.06), 0 8px 28px rgba(22,59,43,.08);
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
:root:not([data-theme="light"]) @media (prefers-color-scheme: dark){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:#0E1A14; --surface:#16261D; --surface-2:#1B2E22;
    --ink:#E7EFE9; --muted:#9DB0A5;
    --brand:#5FB488; --brand-soft:#78C79C;
    --gold:#F0B33A; --gold-deep:#F0B33A;
    --line:rgba(255,255,255,.12); --line-strong:rgba(255,255,255,.22);
    --good:#5FB488; --good-bg:rgba(95,180,136,.15);
    --bad:#E27A63; --bad-bg:rgba(226,122,99,.14);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#0E1A14; --surface:#16261D; --surface-2:#1B2E22;
  --ink:#E7EFE9; --muted:#9DB0A5;
  --brand:#5FB488; --brand-soft:#78C79C;
  --gold:#F0B33A; --gold-deep:#F0B33A;
  --line:rgba(255,255,255,.12); --line-strong:rgba(255,255,255,.22);
  --good:#5FB488; --good-bg:rgba(95,180,136,.15);
  --bad:#E27A63; --bad-bg:rgba(226,122,99,.14);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--ground); color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:17px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--brand);z-index:60}

/* ---------- Header ---------- */
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:50;
  background:var(--brand); color:#F7F4EC;
  box-shadow:0 2px 14px rgba(0,0,0,.14);
}
.topbar__inner{max-width:760px;margin:0 auto;padding:12px 18px 14px}
.brandline{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.brandmark{display:flex;align-items:center;gap:9px;min-width:0}
.brandmark svg{flex:0 0 auto}
.brandmark b{font-family:'Roboto Slab',serif;font-weight:800;font-size:15px;letter-spacing:.2px;color:#FFF;white-space:nowrap}
.brandmark span{font-size:12px;color:#CFE0D4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp{margin-left:auto;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);padding:4px 10px;border-radius:999px;flex:0 0 auto}
.xp .star{color:var(--gold);font-size:14px;line-height:1}
.xp b{font-family:'Space Mono',monospace;font-size:14px;color:#FFF}
.xp small{font-size:11px;color:#CFE0D4}
.progress{height:8px;background:rgba(255,255,255,.16);border-radius:999px;overflow:hidden}
.progress__fill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),#F4C85B);border-radius:999px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.phasedots{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.dot{flex:1 1 0;min-width:22px;height:5px;border-radius:999px;background:rgba(255,255,255,.2)}
.dot.done{background:var(--gold)}
.dot.current{background:#F7F4EC}

/* ---------- Layout ---------- */
.wrap{max-width:760px;margin:0 auto;padding:26px 18px 60px}
.eyebrow{font-size:13px;color:var(--brand-soft);font-weight:700;margin:0 0 6px}
h1.title{font-family:'Roboto Slab',serif;font-weight:800;font-size:clamp(28px,6vw,40px);line-height:1.05;margin:0 0 6px;letter-spacing:-.5px}
h2.phase{font-family:'Roboto Slab',serif;font-weight:800;font-size:clamp(23px,5vw,30px);line-height:1.1;margin:0 0 4px;letter-spacing:-.3px}
.phasekicker{font-size:14px;color:var(--gold-deep);font-weight:700;margin:0 0 14px}
.lead{font-size:18px;color:var(--ink);margin:0 0 18px}
p{margin:0 0 15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 22px;box-shadow:var(--shadow);margin:0 0 20px}
.content p:last-child{margin-bottom:0}
strong{font-weight:700}

/* legal callout */
.lei{border-left:4px solid var(--brand);background:var(--surface-2);border-radius:0 12px 12px 0;padding:13px 16px;margin:0 0 15px}
.lei .ref{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:var(--brand);padding:2px 9px;border-radius:999px;margin-bottom:7px}
.lei p{margin:0;font-size:15.5px;color:var(--ink)}
.tiein{display:flex;gap:11px;align-items:flex-start;background:rgba(232,163,23,.1);border:1px dashed var(--gold);border-radius:12px;padding:13px 15px;margin:4px 0 0}
.tiein .ic{flex:0 0 auto;font-size:18px;line-height:1.4}
.tiein p{margin:0;font-size:15px}
.tiein b{color:var(--gold-deep)}

/* ---------- Challenge ---------- */
.challenge{background:var(--surface);border:2px solid var(--gold);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.challenge__tag{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--gold-deep);margin-bottom:9px}
.challenge h3{font-family:'Roboto Slab',serif;font-weight:700;font-size:20px;margin:0 0 4px;color:var(--ink)}
.challenge__hint{font-size:14px;color:var(--muted);margin:0 0 16px}

.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;margin:0 0 10px;cursor:pointer;font:inherit;color:var(--ink);transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--line-strong)}
.opt .bullet{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);margin-top:1px}
.opt.sel{border-color:var(--brand);background:var(--good-bg)}
.opt.sel .bullet{border-color:var(--brand);background:var(--brand);color:#fff}
.opt.correct{border-color:var(--good);background:var(--good-bg)}
.opt.correct .bullet{border-color:var(--good);background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .bullet{border-color:var(--bad);background:var(--bad);color:#fff}
.opt.lock{pointer-events:none;opacity:.95}

/* buckets / tf rows */
.qrow{background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.qrow__txt{font-size:15.5px;margin:0 0 10px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 1 120px;font:inherit;font-size:14px;font-weight:600;padding:9px 10px;border-radius:9px;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer;transition:all .14s}
.seg button:hover{border-color:var(--brand)}
.seg button.on{border-color:var(--brand);background:var(--brand);color:#fff}
.qrow.ok{border-color:var(--good);background:var(--good-bg)}
.qrow.no{border-color:var(--bad);background:var(--bad-bg);animation:shake .4s}
.qrow.ok .seg button.on{background:var(--good);border-color:var(--good)}
.qrow.no .seg button.on{background:var(--bad);border-color:var(--bad)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* match */
.match{display:grid;grid-template-columns:1fr;gap:10px}
.matchcol{display:flex;flex-direction:column;gap:9px}
.mitem{font:inherit;font-size:14.5px;text-align:left;background:var(--surface-2);border:1.5px solid var(--line);border-radius:11px;padding:11px 13px;cursor:pointer;color:var(--ink);transition:all .14s;position:relative}
.mitem:hover{border-color:var(--line-strong)}
.mitem.active{border-color:var(--gold);background:rgba(232,163,23,.12)}
.mitem.paired{border-color:var(--brand)}
.mitem .pin{position:absolute;right:10px;top:10px;font-size:11px;font-weight:700;color:#fff;background:var(--brand);width:20px;height:20px;border-radius:50%;display:grid;place-items:center}
.mitem.done{border-color:var(--good);background:var(--good-bg);pointer-events:none}
.mitem.done .pin{background:var(--good)}
.matchlabel{font-size:12px;font-weight:700;color:var(--muted);margin:2px 0 2px;text-transform:none}

/* feedback + buttons */
.feedback{margin:16px 0 0;padding:13px 15px;border-radius:12px;font-size:15px;display:none}
.feedback.show{display:block}
.feedback.good{background:var(--good-bg);border:1px solid var(--good);color:var(--ink)}
.feedback.bad{background:var(--bad-bg);border:1px solid var(--bad);color:var(--ink)}
.feedback b{color:inherit}
.btn{font:inherit;font-weight:700;font-size:16px;border:none;border-radius:12px;padding:14px 22px;cursor:pointer;transition:transform .1s,filter .15s}
.btn:active{transform:translateY(1px)}
.btn--primary{background:var(--brand);color:#fff;width:100%}
.btn--primary:hover{filter:brightness(1.08)}
.btn--gold{background:var(--gold);color:#3A2A05;width:100%}
.btn--gold:hover{filter:brightness(1.05)}
.btn--ghost{background:transparent;color:var(--brand-soft);border:1.5px solid var(--line-strong);font-size:14px;padding:10px 16px}
.btnrow{margin-top:18px}

/* badge toast */
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(120%);background:var(--brand);color:#fff;border-radius:16px;padding:14px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.3);z-index:80;transition:transform .45s cubic-bezier(.2,.9,.3,1.2);max-width:min(92vw,420px)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast .seal{font-size:26px}
.toast b{font-family:'Roboto Slab',serif;font-size:15px;display:block}
.toast small{font-size:13px;color:#CFE0D4}

/* comprovante */
.cert{background:var(--brand);color:#F7F4EC;border-radius:18px;padding:24px;box-shadow:var(--shadow)}
.cert h3{font-family:'Roboto Slab',serif;font-size:21px;margin:0 0 6px;color:#fff}
.cert p{color:#D7E6DC;font-size:15px}
.code{font-family:'Space Mono',monospace;font-size:15px;font-weight:700;background:rgba(0,0,0,.25);border:1px dashed rgba(255,255,255,.4);border-radius:10px;padding:14px;white-space:pre-wrap;word-break:break-word;color:#FFE6AE;margin:14px 0;text-align:left;line-height:1.7}
.field{margin:0 0 14px}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.field input{width:100%;font:inherit;font-size:16px;padding:13px 14px;border-radius:11px;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink)}
.field input:focus{outline:2px solid var(--gold);border-color:var(--gold)}

/* footer */
.foot{max-width:760px;margin:10px auto 0;padding:22px 18px 40px;color:var(--muted);font-size:13px;text-align:center;border-top:1px solid var(--line)}
.foot b{color:var(--brand-soft)}
.reset{margin-top:10px}


.footlogo{margin:0 0 14px}
.glogo{height:40px;width:auto;max-width:200px;display:none}
.glogo--light{display:inline-block}
.glogo--dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .glogo--light{display:none}:root:not([data-theme="light"]) .glogo--dark{display:inline-block}}
:root[data-theme="dark"] .glogo--light{display:none}
:root[data-theme="dark"] .glogo--dark{display:inline-block}
.fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

        <p>Todo sistema percorre um <strong>ciclo de vida</strong> (CVDS) — cinco grandes etapas que vão da primeira ideia até a manutenção do sistema já no ar.</p>
        <div class="lei"><span class="ref">1 · Investigação</span><p>Estudo de <strong>viabilidade</strong>: vale a pena construir? É viável em termos técnicos, econômicos e de pessoas? Aqui também nasce o plano do projeto.</p></div>
        <div class="lei"><span class="ref">2 · Análise</span><p>Levantar as <strong>necessidades de informação</strong> dos interessados e transformá-las em <strong>necessidades funcionais</strong> — é aqui que os requisitos do Eixo 2 entram.</p></div>
        <div class="lei"><span class="ref">3 · Projeto</span><p>Desenhar as <strong>especificações</strong> (dados, telas, regras) e os <strong>modelos lógicos</strong> do sistema. É a planta antes da obra.</p></div>

      content:`
        <p>Existem jeitos diferentes de atravessar o ciclo de vida — os <strong>modelos de processo</strong>. Vale conhecer os extremos.</p>
        <div class="lei"><span class="ref">Modelo Cascata</span><p>Sequencial: uma fase só começa quando a anterior termina, cada etapa gera <strong>documentos aprovados</strong> antes de avançar. Funciona quando os requisitos são <strong>estáveis e bem compreendidos</strong> — mas mudar algo depois é caro e trabalhoso.</p></div>
        <div class="lei"><span class="ref">Desenvolvimento incremental</span><p>Entrega o sistema em <strong>versões</strong>: a cada ciclo, novas funcionalidades. Reduz o custo de mudança, facilita o <strong>feedback</strong> do cliente e entrega software útil <strong>mais cedo</strong>.</p></div>
        <div class="lei"><span class="ref">Métodos ágeis</span><p>Colaboração estreita com quem tem o problema, <strong>entregas frequentes de valor</strong>, equipes <strong>auto-organizadas</strong> e boas-vindas à mudança — mesmo tardia. (Scrum, XP e outros nascem daqui.)</p></div>

      content:`
        <p>O nosso projeto usa o <strong>Spec-Driven Development</strong>: desenvolver guiado por uma <strong>especificação clara</strong>, escrita <strong>antes</strong> do código, a partir dos requisitos que você levantou no Eixo 2.</p>
        <div class="lei"><span class="ref">A spec é um contrato</span><p>Ela diz, sem ambiguidade, o que a próxima parte do sistema deve fazer. Quem programa constrói <strong>para a spec</strong>; quem valida confere <strong>contra a spec</strong>. Menos "achismo", menos retrabalho.</p></div>
        <p>E isso se combina com entregas <strong>incrementais</strong> em ciclos curtos — o <strong>Thin Slice</strong> (fatias finas, de cerca de 15 dias). A cada ciclo, uma fatia do sistema é <strong>especificada, construída e validada</strong>. Assim o síndico vê valor cedo e corrige o rumo antes de a gente construir demais na direção errada.</p>

          {t:"Às vezes assinar um serviço pronto (SaaS) é melhor do que construir tudo do zero.",ok:true}
        ],
        right:"Isso. Spec <b>antes</b> do código, validação em <b>fatias curtas</b>, e nem tudo precisa ser construído — às vezes se assina.",
        wrong:"Quase. O Spec-Driven não constrói tudo de uma vez: ele guia o código pela spec e valida em ciclos curtos. Ajuste as marcadas."
      }
    },
    {
      id:4, badge:"Pensa em MVP", seal:"🚀",
      kicker:"Fase 4 — da spec ao MVP",
      title:"O MVP e a automação financeira",
      content:`
        <p>Se o sistema vai ser construído em fatias, qual fatia vem <strong>primeiro</strong>? A resposta é o <strong>MVP</strong> — produto mínimo viável: a <strong>menor versão</strong> que já entrega valor de verdade e permite testar a ideia com usuários reais.</p>
        <p>No nosso caso, o coração da dor é <strong>financeiro</strong> — então o MVP automatiza o núcleo: cadastrar as unidades e suas frações ideais, <strong>gerar boletos com rateio</strong>, registrar pagamentos, calcular juros e multa, e emitir a <strong>prestação de contas</strong>. É isso que tira o condomínio da planilha.</p>
        <p>O resto — reserva de salão, chat entre moradores, app sofisticado — é bom, mas <strong>fica para versões seguintes</strong>. Decidir o que entra e o que espera é <strong>priorização</strong> (lembra do MoSCoW, no Eixo 2?).</p>
        <div class="tiein"><span class="ic">💰</span><p><b>O pulo do gato:</b> um MVP enxuto e financeiro entrega valor na primeira fatia e dá ao síndico idoso algo que ele já consegue usar — em vez de um sistema gigante que demora e ninguém adota.</p></div>
      `,
      challenge:{
        type:"buckets", points:100,
        q:"Entra no MVP ou fica para depois?",
        hint:"Pergunte: sem isso, o síndico já sai da planilha? Se sim, é MVP.",
        cats:["No MVP","Fica pra depois"],
        items:[
          {t:"Gerar boletos da taxa com rateio por fração ideal",a:0},
          {t:"Registrar quem pagou e quem está devendo",a:0},
          {t:"Reserva do salão de festas pelo app",a:1},
          {t:"Emitir a prestação de contas do mês",a:0},
          {t:"Chat entre moradores",a:1},
          {t:"Cadastrar as unidades e suas frações ideais",a:0},
          {t:"Calcular juros e multa de atraso automaticamente",a:0},
          {t:"Integração com a rede social do condomínio",a:1}
        ],
        right:"Isso. O MVP ataca o <b>núcleo financeiro</b> (a dor real); conforto extra entra nas próximas versões, sem travar a primeira entrega.",
        wrong:"Reveja. O que é essencial para tirar a gestão da planilha entra no <b>MVP</b>; o que é conveniência fica <b>pra depois</b>."
      }
    },
    {
      id:5, badge:"Comprovante liberado", seal:"🎓",
      kicker:"Fase 5 — desafio final",
      title:"A charada e o seu comprovante",
      final:true,
      content:`
        <p>Agora você sabe como o sistema sai do papel: um ciclo de vida percorrido em fatias curtas, guiado por especificação, começando por uma primeira versão enxuta e financeira. É com isso que a equipe começa a construir de verdade.</p>
        <p>Falta provar a travessia. Resolva a charada abaixo e gere o seu <strong>comprovante de conclusão do Eixo 3</strong>.</p>
      `
    }
  ];

  const TOTAL = PHASES.length;

  // ---------- state ----------
  let state = load() || { phase:0, xp:0, done:[], name:"" };
  function load(){ try{ const r=localStorage.getItem(KEY); return r?JSON.parse(r):null; }catch(e){ return null; } }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

  const $ = s => document.querySelector(s);
  const stage = $("#stage");

  function paintHud(){
    $("#xpval").textContent = state.xp;
    const pct = Math.round((state.done.length/TOTAL)*100);
    $("#pfill").style.width = pct+"%";
    const dots = $("#dots"); dots.innerHTML="";
    PHASES.forEach((p,i)=>{
      const d=document.createElement("div");
      d.className="dot"+(state.done.includes(i)?" done":"")+(i===state.phase?" current":"");
      dots.appendChild(d);
    });
  }

  function addXp(n){ state.xp+=n; save(); paintHud(); }

  function toast(title,sub){
    $("#toastTitle").textContent=title; $("#toastSub").textContent=sub||"";
    const t=$("#toast"); t.classList.add("show");
    setTimeout(()=>t.classList.remove("show"),2600);
  }

  function esc(s){return s;}

  // ---------- render a phase ----------
  function render(){
    paintHud();
    const p = PHASES[state.phase];
    const solved = state.done.includes(state.phase);
    let html = `<div class="fade">`;
    if(p.hero){ html += `<p class="eyebrow">${p.kicker}</p><h1 class="title">${p.title}</h1>`; }
    else { html += `<p class="phasekicker">${p.kicker}</p><h2 class="phase">${p.title}</h2>`; }
    html += `<div class="card content">${p.content}</div>`;
    if(p.final){
      html += renderFinal(solved);
    } else {
      html += `<div id="chbox">${renderChallenge(p.challenge, solved)}</div>`;
    }
    html += `</div>`;
    stage.innerHTML = html;
    window.scrollTo({top:0,behavior:"instant"});
    wire(p);
  }

  // ---------- challenge renderers ----------
  function challengeHead(c){
    return `<div class="challenge__tag">◆ Desafio</div><h3>${c.q}</h3><p class="challenge__hint">${c.hint}</p>`;
  }

  function renderChallenge(c, solved){
    let inner="";
    if(c.type==="mcq"){
      inner = c.options.map((o,i)=>`<button class="opt" data-i="${i}"><span class="bullet">${String.fromCharCode(65+i)}</span><span>${o.t}</span></button>`).join("");
    }
    if(c.type==="buckets"){
      inner = c.items.map((it,i)=>`<div class="qrow" data-i="${i}"><div class="qrow__txt">${it.t}</div><div class="seg">${c.cats.map((ct,ci)=>`<button data-c="${ci}">${ct}</button>`).join("")}</div></div>`).join("");
    }
    if(c.type==="tf"){
      inner = c.items.map((it,i)=>`<div class="qrow" data-i="${i}"><div class="qrow__txt">${it.t}</div><div class="seg"><button data-c="1">Verdadeiro</button><button data-c="0">Falso</button></div></div>`).join("");
    }
    if(c.type==="match"){
      const rshuf = shuffleIdx(c.right.length);
      pendingMatch = {order:rshuf};
      inner = `<p class="matchlabel">Papéis</p><div class="matchcol" id="mL">`+
        c.left.map((l,i)=>`<button class="mitem" data-side="L" data-i="${i}">${l}</button>`).join("")+
        `</div><p class="matchlabel">Funções</p><div class="matchcol" id="mR">`+
        rshuf.map((ri,pos)=>`<button class="mitem" data-side="R" data-i="${ri}">${c.right[ri]}</button>`).join("")+
        `</div>`;
    }
    return `<div class="challenge">${challengeHead(c)}${inner}
      <div class="feedback" id="fb"></div>
      <div class="btnrow" id="cbtns"><button class="btn btn--gold" id="checkBtn">Conferir</button></div>
    </div>`;
  }

  function renderFinal(solved){
    const c = `<div class="card content">
      <div class="lei"><span class="ref">Charada</span><p>Sou a menor versão do sistema que já entrega valor de verdade e permite testar a ideia com usuários reais, antes de construir tudo. Tenho três letras. <strong>O que sou?</strong></p></div>
      <div class="field"><label for="ans">Sua resposta</label><input id="ans" type="text" autocomplete="off" placeholder="uma palavra" ${solved?'disabled':''}></div>
      <div class="field"><label for="nm">Seu nome completo (vai no comprovante)</label><input id="nm" type="text" autocomplete="name" placeholder="Nome e sobrenome" value="${state.name||''}" ${solved?'disabled':''}></div>
      <div class="feedback" id="fb"></div>
      <div class="btnrow"><button class="btn btn--gold" id="genBtn" ${solved?'style="display:none"':''}>Gerar meu comprovante</button></div>
    </div>`;
    const cert = solved ? renderCert() : "";
    return c + cert;
  }

  function renderCert(){
    return `<div class="cert fade" id="certbox">
      <h3>🎓 Comprovante de conclusão — Eixo 3</h3>
      <p>Guarde este código. É a sua <strong>entrega</strong> da atividade assíncrona: copie e envie no formulário / para a professora.</p>
      <div class="code" id="codeTxt"></div>
      <button class="btn btn--gold" id="copyBtn">Copiar comprovante</button>
    </div>`;
  }

  // ---------- interactions ----------
  let pendingMatch = null;
  let matchState = { active:null, pairs:{} };  // pairs: Lindex -> Rindex

  function wire(p){
    if(p.final){ wireFinal(); return; }
    const solved = state.done.includes(state.phase);
    if(solved){ lockSolved(p.challenge); return; }
    const c = p.challenge;
    if(c.type==="mcq") wireMcq(c);
    if(c.type==="buckets"||c.type==="tf") wireSeg(c);
    if(c.type==="match") wireMatch(c);
  }

  let mcqPick=null, segPick={}, tries=0;

  function wireMcq(c){
    mcqPick=null; tries=0;
    stage.querySelectorAll(".opt").forEach(b=>{
      b.addEventListener("click",()=>{
        stage.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));
        b.classList.add("sel"); mcqPick=+b.dataset.i;
      });
    });
    $("#checkBtn").addEventListener("click",()=>{
      if(mcqPick==null){ flash("Escolha uma opção.",false); return; }
      tries++;
      const ok = c.options[mcqPick].ok;
      const btns = stage.querySelectorAll(".opt");
      if(ok){
        btns[mcqPick].classList.remove("sel"); btns[mcqPick].classList.add("correct","lock");
        finishChallenge(c, c.right, tries);
      } else {
        btns[mcqPick].classList.add("wrong");
        flash(c.wrong,false);
        setTimeout(()=>btns[mcqPick].classList.remove("wrong","sel"),700);
      }
    });
  }

  function wireSeg(c){
    segPick={}; tries=0;
    stage.querySelectorAll(".qrow").forEach(row=>{
      const i=+row.dataset.i;
      row.querySelectorAll(".seg button").forEach(btn=>{
        btn.addEventListener("click",()=>{
          row.querySelectorAll(".seg button").forEach(x=>x.classList.remove("on"));
          btn.classList.add("on"); segPick[i]=+btn.dataset.c;
          row.classList.remove("no");
        });
      });
    });
    $("#checkBtn").addEventListener("click",()=>{
      const n=c.items.length;
      if(Object.keys(segPick).length<n){ flash("Responda todas as linhas.",false); return; }
      tries++;
      let allok=true;
      c.items.forEach((it,i)=>{
        const row=stage.querySelector('.qrow[data-i="'+i+'"]');
        const want = (c.type==="tf") ? (it.ok?1:0) : it.a;
        if(segPick[i]===want){ row.classList.add("ok"); row.classList.remove("no"); }
        else { row.classList.add("no"); row.classList.remove("ok"); allok=false; }
      });
      if(allok){ lockRows(); finishChallenge(c, c.right, tries); }
      else { flash(c.wrong,false); }
    });
  }

  function lockRows(){ stage.querySelectorAll(".qrow .seg button").forEach(b=>b.style.pointerEvents="none"); }

  function wireMatch(c){
    matchState={active:null,pairs:{}}; tries=0;
    const items = stage.querySelectorAll(".mitem");
    items.forEach(b=>{
      b.addEventListener("click",()=>{
        const side=b.dataset.side, idx=+b.dataset.i;
        if(side==="L"){
          stage.querySelectorAll('.mitem[data-side="L"]').forEach(x=>x.classList.remove("active"));
          matchState.active = {side:"L",idx};
          b.classList.add("active");
        } else {
          if(!matchState.active){ return; }
          const L = matchState.active.idx;
          // set/replace pair
          matchState.pairs[L]=idx;
          repaintMatch(c);
        }
      });
    });
    $("#checkBtn").addEventListener("click",()=>{
      if(Object.keys(matchState.pairs).length<c.left.length){ flash("Ligue todos os papéis.",false); return; }
      tries++;
      let allok=true;
      c.left.forEach((l,li)=>{
        const got = matchState.pairs[li];
        if(got!==c.key[li]) allok=false;
      });
      if(allok){
        stage.querySelectorAll(".mitem").forEach(x=>x.classList.add("done"));
        finishChallenge(c, c.rightText, tries);
      } else {
        flash(c.wrong,false);
      }
    });
  }

  function repaintMatch(c){
    // number the pairs
    const used={};
    let pnum=0;
    const Ls = stage.querySelectorAll('.mitem[data-side="L"]');
    const Rs = stage.querySelectorAll('.mitem[data-side="R"]');
    Ls.forEach(x=>{x.classList.remove("paired","active");x.querySelector(".pin")?.remove();});
    Rs.forEach(x=>{x.classList.remove("paired");x.querySelector(".pin")?.remove();});
    Object.keys(matchState.pairs).forEach(Lk=>{
      pnum++;
      const L=+Lk, R=matchState.pairs[Lk];
      const lb=stage.querySelector('.mitem[data-side="L"][data-i="'+L+'"]');
      const rb=stage.querySelector('.mitem[data-side="R"][data-i="'+R+'"]');
      [lb,rb].forEach(el=>{ if(el){ el.classList.add("paired"); const pin=document.createElement("span"); pin.className="pin"; pin.textContent=pnum; el.appendChild(pin);} });
    });
    matchState.active=null;
  }

  function finishChallenge(c, msg, triesUsed){
    const pts = Math.max(25, c.points - (triesUsed-1)*25);
    if(!state.done.includes(state.phase)){
      state.done.push(state.phase);
      addXp(pts);
    }
    save();
    flash(msg, true);
    const seal = PHASES[state.phase].seal, badge = PHASES[state.phase].badge;
    toast("Selo: "+badge, "+"+pts+" XP");
    const cb=$("#cbtns");
    const last = state.phase>=TOTAL-1;
    cb.innerHTML = `<button class="btn btn--primary" id="nextBtn">${last?"Concluir":"Avançar para a próxima fase →"}</button>`;
    $("#nextBtn").addEventListener("click",()=>{
      if(state.phase<TOTAL-1){ state.phase++; save(); render(); }
    });
  }

  function lockSolved(c){
    // if revisiting a solved phase, show answers locked + advance
    const cb=$("#cbtns"); if(!cb) return;
    const last = state.phase>=TOTAL-1;
    cb.innerHTML = `<button class="btn btn--primary" id="nextBtn">${last?"Ir ao comprovante":"Avançar →"}</button>`;
    $("#checkBtn")?.remove();
    $("#nextBtn").addEventListener("click",()=>{ if(state.phase<TOTAL-1){ state.phase++; save(); render(); } });
    stage.querySelectorAll(".opt,.seg button,.mitem").forEach(b=>b.style.pointerEvents="none");
  }

  function flash(msg, good){
    const fb=$("#fb"); if(!fb) return;
    fb.className="feedback show "+(good?"good":"bad");
    fb.innerHTML = (good?"<b>Isso! </b>":"<b>Ainda não. </b>")+msg;
  }

  // ---------- final ----------
  function wireFinal(){
    const solved = state.done.includes(state.phase);
    if(solved){ wireCopy(); return; }
    $("#genBtn").addEventListener("click",()=>{
      const ans = norm($("#ans").value);
      const nm = $("#nm").value.trim();
      if(!nm){ flash("Escreva seu nome completo para o comprovante.",false); return; }
      if(ans!=="MVP" && ans!=="PRODUTO MINIMO VIAVEL"){
        flash("Essa não é a sigla. Reveja a Fase 4: a menor versão que já entrega valor.",false);
        return;
      }
      state.name=nm;
      if(!state.done.includes(state.phase)){ state.done.push(state.phase); addXp(100); }
      save();
      render();
    });
  }

  function wireCopy(){
    const codeEl=$("#codeTxt"); if(codeEl){ codeEl.textContent = buildComprovante(); }
    const btn=$("#copyBtn"); if(!btn) return;
    btn.addEventListener("click",()=>{
      const txt=buildComprovante();
      try{ navigator.clipboard.writeText(txt); btn.textContent="Copiado \u2713"; setTimeout(()=>btn.textContent="Copiar comprovante",1800);}catch(e){
        btn.textContent="Selecione e copie manualmente";
      }
    });
  }

  function buildComprovante(){
    const d=new Date();
    const ymd = d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
    const tk = tokenFrom((state.name||"")+ymd);
    const nome = (state.name||"(sem nome)").trim();
    return "COMPROVANTE \u00b7 EIXO 3 \u2014 Da Planilha ao Sistema\n"
         + "Aluno(a): " + nome + "\n"
         + "C\u00f3digo: EIXO3-5de5-" + state.xp + "xp-" + ymd + "-" + tk;
  }
  function tokenFrom(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i))>>>0; } return h.toString(36).toUpperCase().slice(0,5).padStart(5,"0"); }

  // ---------- utils ----------
  function norm(s){ return (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/\s+/g," ").trim(); }
  function shuffleIdx(n){ const a=[...Array(n).keys()]; for(let i=n-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

  $("#resetBtn").addEventListener("click",()=>{
    if(confirm("Recomeçar do zero? Seu progresso neste aparelho será apagado.")){
      state={phase:0,xp:0,done:[],name:""}; save(); render();
    }
  });

  render();
})();
</script>
</body>
</html>
